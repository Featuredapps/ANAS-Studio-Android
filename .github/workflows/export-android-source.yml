name: Export ANAS Studio Android Source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/export-android-source.yml'
      - 'ANAS-Studio-Android-Project.zip'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p exported
          ARCHIVE="$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)"
          test -n "$ARCHIVE"
          unzip -q "$ARCHIVE" -d extracted
          PROJECT_DIR="$(find extracted -type f -name settings.gradle -printf '%h\n' -quit)"
          test -n "$PROJECT_DIR"
          cp -a "$PROJECT_DIR"/. exported/
          find exported -maxdepth 5 -type f | sort
      - uses: actions/upload-artifact@v4
        with:
          name: anas-studio-android-source
          path: exported/
          if-no-files-found: error
          retention-days: 7
