name: Build ANAS Studio APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Android SDK
        run: |
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" || find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -n 1)"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          "$SDKMANAGER" --version

      - name: Install Android SDK packages
        run: |
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project and build APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p project
          ARCHIVE="$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)"
          test -n "$ARCHIVE"
          unzip -q "$ARCHIVE" -d project
          PROJECT_DIR="$(find project -type f -name settings.gradle -printf '%h\n' -quit)"
          test -n "$PROJECT_DIR"
          mkdir -p "$PROJECT_DIR/app/src/main/res/drawable"
          cp "$GITHUB_WORKSPACE/branding/ic_launcher.xml" "$PROJECT_DIR/app/src/main/res/drawable/ic_launcher.xml"
          sed -i '/android:label="ANAS Studio"/a\        android:icon="@drawable/ic_launcher"\n        android:roundIcon="@drawable/ic_launcher"' "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug
          install -D app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/app-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ANAS-Studio-APK
          path: app-debug.apk
          if-no-files-found: error
          retention-days: 7
