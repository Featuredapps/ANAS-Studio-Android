name: Build ANAS Studio APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Android SDK
        run: |
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" || find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -n 1)"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          "$SDKMANAGER" --version

      - name: Install Android SDK packages
        run: |
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare stable signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${ANDROID_KEYSTORE_BASE64:-}" ]]; then
            echo "::error::Missing repository Actions secret: ANDROID_KEYSTORE_BASE64"
            exit 1
          fi
          if [[ -z "${ANDROID_KEYSTORE_PASSWORD:-}" ]]; then
            echo "::error::Missing repository Actions secret: ANDROID_KEYSTORE_PASSWORD"
            exit 1
          fi
          # Normalize whitespace so wrapped Base64 pasted into GitHub Secrets is accepted.
          KEYSTORE_B64="$(printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]')"
          if ! printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/anas-studio-release.jks"; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is invalid or incomplete. Replace it with the complete one-line value from the corrected signing file."
            exit 1
          fi
          if ! keytool -list -keystore "$RUNNER_TEMP/anas-studio-release.jks" -storepass "$ANDROID_KEYSTORE_PASSWORD" >/dev/null 2>&1; then
            echo "::error::Keystore could not be opened. Check ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD."
            exit 1
          fi
          if [[ ! -s "$RUNNER_TEMP/anas-studio-release.jks" ]]; then
            echo "::error::Decoded keystore file is empty."
            exit 1
          fi
          echo "KEYSTORE_FILE=$RUNNER_TEMP/anas-studio-release.jks" >> "$GITHUB_ENV"

      - name: Extract project and build APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p project
          ARCHIVE="$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)"
          test -n "$ARCHIVE"
          unzip -q "$ARCHIVE" -d project
          PROJECT_DIR="$(find project -type f -name settings.gradle -printf '%h\n' -quit)"
          test -n "$PROJECT_DIR"
          MANIFEST="$(find "$PROJECT_DIR" -path '*/src/main/AndroidManifest.xml' -type f -print -quit)"
          test -n "$MANIFEST"
          MAIN_DIR="$(dirname "$MANIFEST")"
          mkdir -p "$MAIN_DIR/res/drawable"
          cp "$GITHUB_WORKSPACE/branding/ic_launcher.xml" "$MAIN_DIR/res/drawable/ic_launcher.xml"
          MANIFEST="$MANIFEST" python3 - <<'PY'
          import os
          from pathlib import Path
          manifest = Path(os.environ["MANIFEST"])
          content = manifest.read_text()
          start = content.find("<application")
          if start < 0:
              raise SystemExit("No application element in AndroidManifest.xml")
          end = content.find(">", start)
          if end < 0:
              raise SystemExit("Malformed application element")
          tag = content[start:end]
          if "android:icon=" not in tag:
              content = content[:end] + '\n        android:icon="@drawable/ic_launcher"\n        android:roundIcon="@drawable/ic_launcher"' + content[end:]
          manifest.write_text(content)
          PY
          MAIN_ACTIVITY="$(find "$PROJECT_DIR" -path '*/src/main/java/com/anasgdxj/studio/MainActivity.java' -type f -print -quit)"
          test -n "$MAIN_ACTIVITY"
          MAIN_ACTIVITY="$MAIN_ACTIVITY" python3 - <<'PY'
          import os
          from pathlib import Path
          p = Path(os.environ["MAIN_ACTIVITY"])
          s = p.read_text()
          start = s.find("@JavascriptInterface public void saveBase64File(")
          marker = "\n    }\n\n    private void toast"
          end = s.find(marker, start)
          if start < 0 or end < 0:
              raise SystemExit("Could not locate saveBase64File method for safe MediaStore patch")
          replacement = """@JavascriptInterface public void saveBase64File(String base64, String mime, String name) {
                  if (base64 == null || base64.length() > 180_000_000) {
                      toast("حجم الملف أكبر من الحد المسموح");
                      return;
                  }
                  Uri savedUri = null;
                  try {
                      byte[] bytes = Base64.decode(base64, Base64.DEFAULT);
                      String safeName = name == null ? "anas_export.bin" : name.replaceAll("[^A-Za-z0-9._-]", "_");
                      String contentType = (mime == null || mime.trim().isEmpty()) ? "application/octet-stream" : mime;
                      boolean isVideo = contentType.startsWith("video/");
                      boolean isAudio = contentType.startsWith("audio/");
                      Uri collection;
                      String folder;
                      if (isVideo) {
                          collection = MediaStore.Video.Media.EXTERNAL_CONTENT_URI;
                          folder = Environment.DIRECTORY_MOVIES + "/ANAS Studio";
                      } else if (isAudio) {
                          collection = MediaStore.Audio.Media.EXTERNAL_CONTENT_URI;
                          folder = Environment.DIRECTORY_MUSIC + "/ANAS Studio";
                      } else {
                          collection = MediaStore.Downloads.EXTERNAL_CONTENT_URI;
                          folder = Environment.DIRECTORY_DOWNLOADS + "/ANAS Studio";
                      }
                      ContentValues values = new ContentValues();
                      values.put(MediaStore.MediaColumns.DISPLAY_NAME, safeName);
                      values.put(MediaStore.MediaColumns.MIME_TYPE, contentType);
                      values.put(MediaStore.MediaColumns.RELATIVE_PATH, folder);
                      values.put(MediaStore.MediaColumns.IS_PENDING, 1);
                      savedUri = getContentResolver().insert(collection, values);
                      if (savedUri == null) throw new Exception("تعذر إنشاء ملف الحفظ");
                      try (OutputStream out = getContentResolver().openOutputStream(savedUri, "w")) {
                          if (out == null) throw new Exception("تعذر فتح ملف الحفظ");
                          out.write(bytes);
                          out.flush();
                      }
                      ContentValues ready = new ContentValues();
                      ready.put(MediaStore.MediaColumns.IS_PENDING, 0);
                      getContentResolver().update(savedUri, ready, null, null);
                      String location = isVideo ? "Movies/ANAS Studio" : (isAudio ? "Music/ANAS Studio" : "Downloads/ANAS Studio");
                      toast("تم حفظ الملف بنجاح في " + location);
                  } catch (Exception e) {
                      if (savedUri != null) {
                          try { getContentResolver().delete(savedUri, null, null); } catch (Exception ignored) {}
                      }
                      toast("فشل حفظ الملف: " + e.getMessage());
                  }
              }"""
          p.write_text(s[:start] + replacement + s[end:])
          PY
          MAIN_ACTIVITY="$(find "$PROJECT_DIR" -path '*/src/main/java/com/anasgdxj/studio/MainActivity.java' -type f -print -quit)"
          grep -q 'MediaStore.MediaColumns.IS_PENDING' "$MAIN_ACTIVITY"
          MAIN_ACTIVITY="$MAIN_ACTIVITY" python3 - <<'PY'
          import os
          from pathlib import Path
          p = Path(os.environ["MAIN_ACTIVITY"])
          s = p.read_text()
          old = 'intent.setType("audio/*");'
          new = '''String[] acceptedTypes = params.getAcceptTypes();
                          if (acceptedTypes != null && acceptedTypes.length > 0 && acceptedTypes[0] != null && !acceptedTypes[0].trim().isEmpty()) {
                              intent.setType("*/*");
                              intent.putExtra(Intent.EXTRA_MIME_TYPES, acceptedTypes);
                          } else {
                              intent.setType("audio/*");
                          }'''
          if old not in s:
              raise SystemExit("Could not find audio chooser MIME filter")
          p.write_text(s.replace(old, new, 1))
          PY
          MAIN_ACTIVITY="$(find "$PROJECT_DIR" -path '*/src/main/java/com/anasgdxj/studio/MainActivity.java' -type f -print -quit)"
          MAIN_ACTIVITY="$MAIN_ACTIVITY" python3 - <<'PY'
          import os
          from pathlib import Path
          p = Path(os.environ["MAIN_ACTIVITY"])
          s = p.read_text()
          imports = [
              "import android.view.Gravity;",
              "import android.widget.FrameLayout;",
              "import android.widget.LinearLayout;",
              "import android.widget.TextView;",
              "import android.graphics.Color;",
              "import android.graphics.Typeface;",
              "import android.graphics.drawable.GradientDrawable;",
              "import android.animation.ObjectAnimator;",
              "import android.animation.ValueAnimator;",
              "import android.view.animation.DecelerateInterpolator;",
              "import android.os.Handler;",
              "import android.os.Looper;",
          ]
          for item in imports:
              if item not in s:
                  s = s.replace("import android.view.View;", "import android.view.View;\n" + item, 1)
          fields = """    private FrameLayout rootLayout;
              private View splashOverlay;
              private final Handler splashHandler = new Handler(Looper.getMainLooper());
          """
          s = s.replace("    private SecureKeyStore keyStore;\n", "    private SecureKeyStore keyStore;\n" + fields, 1)
          s = s.replace("        setContentView(webView);", """        rootLayout = new FrameLayout(this);
                  rootLayout.addView(webView, new FrameLayout.LayoutParams(
                      FrameLayout.LayoutParams.MATCH_PARENT, FrameLayout.LayoutParams.MATCH_PARENT));
                  splashOverlay = createAnimatedSplash();
                  rootLayout.addView(splashOverlay, new FrameLayout.LayoutParams(
                      FrameLayout.LayoutParams.MATCH_PARENT, FrameLayout.LayoutParams.MATCH_PARENT));
                  setContentView(rootLayout);
                  splashHandler.postDelayed(() -> dismissSplash(), 2400);
                  splashHandler.postDelayed(() -> dismissSplash(), 10000);""", 1)
          methods = r'''
              private View createAnimatedSplash() {
                  FrameLayout splash = new FrameLayout(this);
                  splash.setBackground(new GradientDrawable(GradientDrawable.Orientation.TL_BR,
                      new int[]{Color.rgb(8, 13, 31), Color.rgb(18, 27, 55), Color.rgb(7, 10, 24)}));
                  View glow = new View(this);
                  GradientDrawable glowBg = new GradientDrawable();
                  glowBg.setShape(GradientDrawable.OVAL);
                  glowBg.setColor(Color.argb(38, 55, 151, 255));
                  glow.setBackground(glowBg);
                  FrameLayout.LayoutParams gp = new FrameLayout.LayoutParams(dp(250), dp(250), Gravity.CENTER);
                  splash.addView(glow, gp);
                  ObjectAnimator glowPulse = ObjectAnimator.ofFloat(glow, View.ALPHA, 0.3f, 0.85f);
                  glowPulse.setDuration(1400);
                  glowPulse.setRepeatCount(ValueAnimator.INFINITE);
                  glowPulse.setRepeatMode(ValueAnimator.REVERSE);
                  glowPulse.start();
                  LinearLayout content = new LinearLayout(this);
                  content.setOrientation(LinearLayout.VERTICAL);
                  content.setGravity(Gravity.CENTER);
                  content.setPadding(dp(28), dp(24), dp(28), dp(24));
                  FrameLayout.LayoutParams cp = new FrameLayout.LayoutParams(
                      FrameLayout.LayoutParams.MATCH_PARENT, FrameLayout.LayoutParams.WRAP_CONTENT, Gravity.CENTER);
                  splash.addView(content, cp);
                  TextView logo = new TextView(this);
                  logo.setText("A");
                  logo.setTextColor(Color.WHITE);
                  logo.setTextSize(66);
                  logo.setTypeface(Typeface.create("sans-serif-black", Typeface.BOLD));
                  logo.setGravity(Gravity.CENTER);
                  GradientDrawable logoBg = new GradientDrawable(GradientDrawable.Orientation.TL_BR,
                      new int[]{Color.rgb(42, 145, 255), Color.rgb(102, 75, 230)});
                  logoBg.setShape(GradientDrawable.OVAL);
                  logoBg.setStroke(dp(2), Color.argb(110, 255, 255, 255));
                  logo.setBackground(logoBg);
                  logo.setElevation(dp(12));
                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(dp(126), dp(126));
                  lp.gravity = Gravity.CENTER;
                  content.addView(logo, lp);
                  logo.setAlpha(0f);
                  logo.setScaleX(0.55f);
                  logo.setScaleY(0.55f);
                  logo.animate().alpha(1f).scaleX(1f).scaleY(1f).rotation(0f)
                      .setDuration(850).setInterpolator(new DecelerateInterpolator(2f)).start();
                  TextView title = new TextView(this);
                  title.setText("ANAS Studio");
                  title.setTextColor(Color.WHITE);
                  title.setTextSize(27);
                  title.setTypeface(Typeface.create("sans-serif", Typeface.BOLD));
                  title.setGravity(Gravity.CENTER);
                  LinearLayout.LayoutParams tp = new LinearLayout.LayoutParams(
                      LinearLayout.LayoutParams.WRAP_CONTENT, LinearLayout.LayoutParams.WRAP_CONTENT);
                  tp.topMargin = dp(25);
                  content.addView(title, tp);
                  title.setAlpha(0f);
                  title.setTranslationY(dp(18));
                  title.animate().alpha(1f).translationY(0f).setStartDelay(380).setDuration(650).start();
                  TextView subtitle = new TextView(this);
                  subtitle.setText("استوديو الإبداع والإنتاج الذكي");
                  subtitle.setTextColor(Color.rgb(177, 195, 225));
                  subtitle.setTextSize(14);
                  subtitle.setGravity(Gravity.CENTER);
                  LinearLayout.LayoutParams sp = new LinearLayout.LayoutParams(
                      LinearLayout.LayoutParams.WRAP_CONTENT, LinearLayout.LayoutParams.WRAP_CONTENT);
                  sp.topMargin = dp(8);
                  content.addView(subtitle, sp);
                  subtitle.setAlpha(0f);
                  subtitle.animate().alpha(1f).setStartDelay(650).setDuration(650).start();
                  TextView loading = new TextView(this);
                  loading.setText("•   •   •");
                  loading.setTextColor(Color.rgb(105, 174, 255));
                  loading.setTextSize(20);
                  loading.setGravity(Gravity.CENTER);
                  LinearLayout.LayoutParams bp = new LinearLayout.LayoutParams(
                      LinearLayout.LayoutParams.WRAP_CONTENT, LinearLayout.LayoutParams.WRAP_CONTENT);
                  bp.topMargin = dp(30);
                  content.addView(loading, bp);
                  ObjectAnimator dots = ObjectAnimator.ofFloat(loading, View.ALPHA, 0.3f, 1f);
                  dots.setDuration(650);
                  dots.setRepeatCount(ValueAnimator.INFINITE);
                  dots.setRepeatMode(ValueAnimator.REVERSE);
                  dots.start();
                  return splash;
              }

              private int dp(float value) {
                  return (int) (value * getResources().getDisplayMetrics().density + 0.5f);
              }

              private void dismissSplash() {
                  if (splashOverlay == null || rootLayout == null) return;
                  View overlay = splashOverlay;
                  splashOverlay = null;
                  overlay.animate().alpha(0f).setDuration(350)
                      .withEndAction(() -> rootLayout.removeView(overlay)).start();
              }

          '''
          if "private View createAnimatedSplash()" not in s:
              anchor = "    @Override protected void onActivityResult"
              if anchor not in s:
                  raise SystemExit("Could not find activity-result insertion point")
              s = s.replace(anchor, methods + anchor, 1)
          p.write_text(s)
          PY
                    HTML_FILE="$(find "$PROJECT_DIR" -path '*/assets/index.html' -type f -print -quit)"
          test -n "$HTML_FILE"
          python3 "$GITHUB_WORKSPACE/mobile-ui/enhance-script-editor.py" "$HTML_FILE"
          python3 "$GITHUB_WORKSPACE/mobile-ui/enhance-audio-persistence.py" "$HTML_FILE"
          python3 "$GITHUB_WORKSPACE/mobile-ui/enhance-gemini-assistant.py" "$HTML_FILE"
          node --version
          python3 "$GITHUB_WORKSPACE/mobile-ui/validate-web.py" "$HTML_FILE"
          HTML_FILE="$HTML_FILE" python3 - <<'PY'
          import os
          from pathlib import Path
          p = Path(os.environ["HTML_FILE"])
          s = p.read_text()
          old = "reader.result.toString().split(',')[1]"
          new = "reader.result.toString().substring(reader.result.toString().lastIndexOf(',') + 1)"
          count = s.count(old)
          if count < 2:
              raise SystemExit(f"Expected both Android save callbacks, found {count}")
          p.write_text(s.replace(old, new))
          PY
          cp "$GITHUB_WORKSPACE/mobile-ui/mobile.css" "$(dirname "$HTML_FILE")/mobile.css"
          HTML_FILE="$HTML_FILE" python3 - <<'PY'
          import os
          from pathlib import Path
          html = Path(os.environ["HTML_FILE"])
          content = html.read_text()
          if "</head>" not in content:
              raise SystemExit("HTML head closing tag not found")
          content = content.replace("</head>", '  <link rel="stylesheet" href="mobile.css">\n</head>', 1)
          html.write_text(content)
          PY
          APP_GRADLE="$PROJECT_DIR/app/build.gradle" python3 - <<'PY'
          import os, re
          from pathlib import Path
          p = Path(os.environ["APP_GRADLE"])
          s = p.read_text()
          run_number = int(os.environ.get("GITHUB_RUN_NUMBER", "1"))
          if re.search(r'\bversionCode\s+\d+', s):
              s = re.sub(r'\bversionCode\s+\d+', f'versionCode {run_number}', s, count=1)
          else:
              m = re.search(r'defaultConfig\s*\{', s)
              if not m:
                  raise SystemExit("defaultConfig block missing in app/build.gradle")
              s = s[:m.end()] + f"\n        versionCode {run_number}" + s[m.end():]
          if re.search(r'\bversionName\s+[\'"]', s):
              s = re.sub(r'\bversionName\s+[\'"][^\'"]*[\'"]', f"versionName '1.0.{run_number}'", s, count=1)
          p.write_text(s)
          PY
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$KEYSTORE_FILE" --ks-key-alias "$ANDROID_KEY_ALIAS" --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEY_PASSWORD --out "$RUNNER_TEMP/anas-studio-signed.apk" "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$RUNNER_TEMP/anas-studio-signed.apk"
          install -D "$RUNNER_TEMP/anas-studio-signed.apk" "$GITHUB_WORKSPACE/app-debug.apk"


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ANAS-Studio-APK
          path: app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Publish latest APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: ANAS Studio - Build #${{ github.run_number }}
          body: |
            إصدار بناء تلقائي لتطبيق ANAS Studio.
            رقم البناء: ${{ github.run_number }}
            Commit: ${{ github.sha }}
            Changes: ${{ github.event.head_commit.message || 'Manual build' }}
            يتم تحديث رابط APK الثابت بعد نجاح البناء.
          files: app-debug.apk
          overwrite_files: true
          make_latest: true
          draft: false
          prerelease: false

