<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ANAS Studio — لوحة الإدارة</title><style>
:root{color-scheme:dark;font-family:system-ui,"Segoe UI",sans-serif;background:#080d17;color:#eef3fb}*{box-sizing:border-box}body{margin:0;padding:24px;background:radial-gradient(circle at 85% 0,#16345a 0,transparent 38%),#080d17}.wrap{max-width:900px;margin:auto}.panel{background:#111c2b;border:1px solid #29394d;border-radius:18px;padding:22px;margin:16px 0}h1{margin:0 0 8px}p,.muted{color:#9fb0c5}input,textarea,button{font:inherit;border-radius:10px;padding:12px;border:1px solid #34465d;background:#0b1421;color:#fff;width:100%;margin:7px 0}button{background:#dba94d;color:#17120a;font-weight:800;border:0;cursor:pointer}button.secondary{background:#26384f;color:#fff}button:disabled{opacity:.5}label{display:block;margin-top:14px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.status{padding:12px;border-radius:10px;background:#0b1421;white-space:pre-wrap}.hidden{display:none}@media(max-width:600px){.row{grid-template-columns:1fr}body{padding:12px}}</style>
<div class="wrap"><h1>ANAS Studio</h1><p>لوحة إدارة التحديثات عن بُعد</p><div class="panel"><label>عنوان خدمة Cloudflare Worker</label><input id="api" placeholder="https://anas-studio-android.anasgdxj.workers.dev"><p class="muted">يُحفظ العنوان في هذا المتصفح فقط.</p><button id="saveApi" class="secondary">حفظ العنوان والاتصال</button><div id="login"><label>كلمة مرور المدير</label><input id="password" type="password" autocomplete="current-password"><button id="loginBtn">تسجيل الدخول</button></div><div id="admin" class="hidden"><hr><h2>نشر تحديث واجهة</h2><label>ملف HTML الكامل للواجهة</label><input id="file" type="file" accept=".html,text/html"><label>ملاحظات الإصدار</label><textarea id="notes" rows="3" placeholder="ما الذي تغير؟"></textarea><button id="publish">نشر التحديث</button><h2>التحقق من التحديث المنشور</h2><button id="verifyBtn" class="secondary">فحص النسخة المنشورة وسلامة الملف</button><div id="verifyResult" class="status">لم يتم الفحص بعد.</div><h2>الإصدارات المنشورة</h2><button id="historyBtn" class="secondary">تحديث السجل</button><div id="history"></div><button id="logout" class="secondary">تسجيل الخروج</button></div><div id="status" class="status">لم يتم الاتصال بعد.</div></div></div>
<script>
const $=id=>document.getElementById(id);let token="";const stored=localStorage.getItem("anas_update_api")||"";$("api").value=stored;
const api=()=> $("api").value.trim().replace(/\/$/,"");function say(s){$("status").textContent=s}
$("saveApi").onclick=async()=>{localStorage.setItem("anas_update_api",api());try{const r=await fetch(api()+"/api/health");say(r.ok?"تم الاتصال بالخدمة.":"تعذر الاتصال: "+r.status)}catch(e){say("فشل الاتصال. تحقق من عنوان Worker وإعدادات النشر.")}};
$("loginBtn").onclick=async()=>{try{const r=await fetch(api()+"/api/admin/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:$("password").value})});const d=await r.json();if(!r.ok)throw Error(d.error||"فشل الدخول");token=d.token;$("login").classList.add("hidden");$("admin").classList.remove("hidden");say("تم تسجيل الدخول.");loadHistory()}catch(e){say(e.message)}};
async function request(path,opts={}){const r=await fetch(api()+path,{...opts,headers:{"Authorization":"Bearer "+token,...(opts.headers||{})}});const d=await r.json();if(!r.ok)throw Error(d.error||"فشل الطلب");return d}
$("publish").onclick=async()=>{const f=$("file").files[0];if(!f){say("اختر ملف HTML أولاً.");return}if(f.size>18*1024*1024){say("الملف يتجاوز الحد 18MB.");return}try{$("publish").disabled=true;say("جارٍ رفع ونشر النسخة...");const html=await f.text();const d=await request("/api/admin/publish",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({html,notes:$("notes").value})});say("تم رفع النسخة "+d.manifest.version+". جارٍ التحقق من التنزيل والبصمة...");await verifyPublished();loadHistory()}catch(e){say(e.message)}finally{$("publish").disabled=false}};
async function loadHistory(){try{const d=await request("/api/admin/history");$("history").innerHTML="";for(const v of d.versions){const b=document.createElement("button");b.className="secondary";b.textContent="استعادة النسخة "+v;b.onclick=async()=>{if(!confirm("استعادة هذه النسخة؟"))return;try{const x=await request("/api/admin/rollback",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({version:v})});say("تم تفعيل النسخة "+x.manifest.version)}catch(e){say(e.message)}};$("history").append(b)}}catch(e){say(e.message)}}
async function verifyPublished(){const out=$("verifyResult");out.textContent="جارٍ فحص الخدمة والنسخة المنشورة...";try{const health=await fetch(api()+"/api/health",{cache:"no-store"});if(!health.ok)throw Error("فشل فحص الخدمة: HTTP "+health.status);const h=await health.json();if(!h.ok||!h.storage)throw Error("الخدمة تعمل لكن تخزين KV غير جاهز.");const vr=await fetch(api()+"/api/version",{cache:"no-store"});if(!vr.ok)throw Error("تعذر قراءة بيانات النسخة: HTTP "+vr.status);const m=await vr.json();if(!m.published)throw Error("الخدمة متاحة، لكن لم يتم نشر واجهة بعد.");if(!m.version||!m.sha256||!m.bytes)throw Error("بيانات النسخة المنشورة ناقصة.");const ar=await fetch(api()+"/app",{cache:"no-store"});if(!ar.ok)throw Error("تعذر تنزيل الواجهة: HTTP "+ar.status);const type=(ar.headers.get("Content-Type")||"").toLowerCase(),ver=ar.headers.get("X-Studio-Version"),hash=(ar.headers.get("X-Studio-SHA256")||"").toLowerCase();if(!type.includes("text/html"))throw Error("نوع الملف المستلم ليس HTML.");if(String(m.version)!==ver)throw Error("رقم النسخة في التنزيل لا يطابق سجل النشر.");if(String(m.sha256).toLowerCase()!==hash)throw Error("بصمة الاستجابة لا تطابق سجل النشر.");const bytes=await ar.arrayBuffer();if(bytes.byteLength!==Number(m.bytes))throw Error("حجم الملف المستلم لا يطابق الحجم المنشور.");const digest=await crypto.subtle.digest("SHA-256",bytes);const actual=[...new Uint8Array(digest)].map(x=>x.toString(16).padStart(2,"0")).join("");if(actual!==String(m.sha256).toLowerCase())throw Error("فشل التحقق من SHA-256 للملف.");const sample=new TextDecoder().decode(bytes.slice(0,512)).toLowerCase();if(!sample.includes("<html"))throw Error("المحتوى المستلم لا يبدو صفحة HTML صالحة.");out.textContent="نجاح: Worker متاح، KV يعمل، النسخة "+m.version+" منشورة، وتم تنزيل الملف والتحقق من الحجم وSHA-256. الحجم: "+bytes.byteLength.toLocaleString()+" بايت. هذا يثبت سلامة النشر والتنزيل، وليس اختبار التطبيق على هاتف.";return true}catch(e){out.textContent="فشل التحقق: "+e.message;return false}}$("verifyBtn").onclick=verifyPublished;$("historyBtn").onclick=loadHistory;$("logout").onclick=()=>{token="";$("admin").classList.add("hidden");$("login").classList.remove("hidden");$("password").value="";say("تم تسجيل الخروج.")};
</script></html>
